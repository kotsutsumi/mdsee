[workspace]
resolver = "2"
members = [
    "crates/mdsee-core",
    "crates/mdsee-layout",
    "crates/mdsee-render",
    "crates/mdsee-terminal",
    "crates/mdsee-image",
    "crates/mdsee-reader",
    "crates/mdsee-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kotsutsumi/mdsee"

[workspace.dependencies]
# mdsee crates
mdsee-core = { version = "0.1.0", path = "crates/mdsee-core" }
mdsee-layout = { version = "0.1.0", path = "crates/mdsee-layout" }
mdsee-render = { version = "0.1.0", path = "crates/mdsee-render" }
mdsee-terminal = { version = "0.1.0", path = "crates/mdsee-terminal" }
mdsee-image = { version = "0.1.0", path = "crates/mdsee-image" }
mdsee-reader = { version = "0.1.0", path = "crates/mdsee-reader" }

# 技術スタック（design.md §3）
clap = { version = "4.6", features = ["derive"] }
comrak = "0.54"
crossterm = "0.29"
ratatui = "0.30"
# default-fancy: 純Rust regex backend。C拡張(oniguruma)を避け全OSで同一buildにする
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
image = "0.25"
resvg = "0.48"
usvg = "0.48"
reqwest = "0.13"
notify = "8"
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
anyhow = "1"
directories = "6"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"

# §91: Binary Size対策のrelease profile
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
