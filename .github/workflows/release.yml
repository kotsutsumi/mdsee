# Release build（design.md §86〜§89）。
#
# tag push（v*）で §86 の5 target をbuildし、§87 の名前でartifactを
# GitHub Release へ添付する。Homebrew buildでは全部入りbinary
# （--all-features）を配布する（§92）。
#
# Homebrew tap（§88, §89）: `kotsutsumi/homebrew-tap` の Formula を
# 末尾の `bump-homebrew` job で version / URL / SHA256 とともに自動更新する。
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release if absent
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; preserving it and its assets."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "${GITHUB_REF_NAME}" \
              --notes "" \
              --verify-tag
          fi

  build:
    name: build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build and upload binary
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          # §92: Homebrew buildでは全部入り（--all-features）
          bin: mdsee
          all-features: true
          target: ${{ matrix.target }}
          # §87: 中身は mdsee / README.md / LICENSE
          include: README.md,LICENSE
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: publish GitHub Release
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

  # §88, §89: Homebrew tapの自動更新。
  bump-homebrew:
    name: bump homebrew tap
    needs: [build, publish-release]
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'kotsutsumi/mdsee' }}
    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kotsutsumi/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        working-directory: homebrew-tap
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"

          sha_for() {
            local name="$1"
            gh release view "$TAG" --repo "$GH_REPO" --json assets \
              --jq ".assets[] | select(.name == \"$name\") | .digest" \
              | sed 's/^sha256://'
          }

          mac_arm_sha="$(sha_for mdsee-aarch64-apple-darwin.tar.gz)"
          mac_intel_sha="$(sha_for mdsee-x86_64-apple-darwin.tar.gz)"
          linux_arm_sha="$(sha_for mdsee-aarch64-unknown-linux-gnu.tar.gz)"
          linux_intel_sha="$(sha_for mdsee-x86_64-unknown-linux-gnu.tar.gz)"

          for sha in "$mac_arm_sha" "$mac_intel_sha" "$linux_arm_sha" "$linux_intel_sha"; do
            test -n "$sha"
          done

          cat > Formula/mdsee.rb <<EOF
          class Mdsee < Formula
            desc "Markdown viewer for your terminal"
            homepage "https://github.com/kotsutsumi/mdsee"
            version "$version"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/kotsutsumi/mdsee/releases/download/v#{version}/mdsee-aarch64-apple-darwin.tar.gz"
                sha256 "$mac_arm_sha"
              else
                url "https://github.com/kotsutsumi/mdsee/releases/download/v#{version}/mdsee-x86_64-apple-darwin.tar.gz"
                sha256 "$mac_intel_sha"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/kotsutsumi/mdsee/releases/download/v#{version}/mdsee-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$linux_arm_sha"
              else
                url "https://github.com/kotsutsumi/mdsee/releases/download/v#{version}/mdsee-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$linux_intel_sha"
              end
            end

            def install
              bin.install "mdsee"
            end

            test do
              assert_match "mdsee #{version}", shell_output("#{bin}/mdsee --version")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mdsee.rb
          if git diff --cached --quiet; then
            echo "Formula is already current."
          else
            git commit -m "mdsee ${version}"
            git push origin HEAD:main
          fi
