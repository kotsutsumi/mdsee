<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">mdsee terminal preview</title>
  <desc id="desc">A dark terminal window showing a mdsee Markdown preview with headings, code, alerts, and a feature table.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#21262d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#0d1117"/>
  <rect x="28" y="24" width="1144" height="712" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2" filter="url(#shadow)"/>
  <rect x="28" y="24" width="1144" height="58" rx="18" fill="url(#header)"/>
  <path d="M28 64h1144v18H28z" fill="#21262d"/>

  <circle cx="64" cy="53" r="8" fill="#ff7b72"/>
  <circle cx="91" cy="53" r="8" fill="#d29922"/>
  <circle cx="118" cy="53" r="8" fill="#3fb950"/>
  <text x="600" y="58" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17">mdsee · docs/image-sample.md</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="72" y="132" fill="#3fb950" font-size="34" font-weight="700"># mdsee</text>
    <text x="72" y="164" fill="#8b949e" font-size="18">Beautiful Markdown in your terminal — a compact showcase</text>

    <rect x="72" y="194" width="1056" height="76" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="96" y="226" fill="#79c0ff" font-size="16">$</text>
    <text x="118" y="226" fill="#c9d1d9" font-size="16">mdsee docs/image-sample.md --theme dark --width 96</text>
    <text x="96" y="252" fill="#8b949e" font-size="15">rendering headings · code · alerts · tables · links</text>

    <rect x="72" y="302" width="510" height="104" rx="10" fill="#101b2b" stroke="#58a6ff"/>
    <text x="96" y="334" fill="#58a6ff" font-size="15" font-weight="700">╭─ NOTE ──────────────────────╮</text>
    <text x="96" y="362" fill="#c9d1d9" font-size="15">│ Local assets keep previews    │</text>
    <text x="96" y="386" fill="#c9d1d9" font-size="15">│ offline and reproducible.    │</text>
    <text x="96" y="394" fill="#58a6ff" font-size="15">╰─────────────────────────────╯</text>

    <rect x="618" y="302" width="510" height="104" rx="10" fill="#241b12" stroke="#dbab79"/>
    <text x="642" y="334" fill="#dbab79" font-size="15" font-weight="700">╭─ WARNING ───────────────────╮</text>
    <text x="642" y="362" fill="#c9d1d9" font-size="15">│ Image backends arrive in    │</text>
    <text x="642" y="386" fill="#c9d1d9" font-size="15">│ v0.2; alt text is safe now. │</text>
    <text x="642" y="394" fill="#dbab79" font-size="15">╰─────────────────────────────╯</text>

    <text x="72" y="454" fill="#58a6ff" font-size="23" font-weight="700">## Feature matrix</text>
    <line x1="72" y1="478" x2="1128" y2="478" stroke="#30363d"/>
    <text x="88" y="508" fill="#8b949e" font-size="15">Feature</text>
    <text x="574" y="508" text-anchor="middle" fill="#8b949e" font-size="15">Status</text>
    <text x="1112" y="508" text-anchor="end" fill="#8b949e" font-size="15">What to look for</text>
    <line x1="72" y1="522" x2="1128" y2="522" stroke="#30363d"/>
    <text x="88" y="552" fill="#c9d1d9" font-size="15">Headings and emphasis</text>
    <text x="574" y="552" text-anchor="middle" fill="#3fb950" font-size="15">ready</text>
    <text x="1112" y="552" text-anchor="end" fill="#c9d1d9" font-size="15">hierarchy and rhythm</text>
    <text x="88" y="582" fill="#c9d1d9" font-size="15">Syntax highlighting</text>
    <text x="574" y="582" text-anchor="middle" fill="#3fb950" font-size="15">ready</text>
    <text x="1112" y="582" text-anchor="end" fill="#c9d1d9" font-size="15">the Rust block above</text>
    <text x="88" y="612" fill="#c9d1d9" font-size="15">Local images</text>
    <text x="574" y="612" text-anchor="middle" fill="#d29922" font-size="15">fixture</text>
    <text x="1112" y="612" text-anchor="end" fill="#c9d1d9" font-size="15">preview and alt-text fallback</text>

    <line x1="72" y1="666" x2="1128" y2="666" stroke="#30363d"/>
    <text x="72" y="698" fill="#8b949e" font-size="15">✓ readable Markdown  ·  ✓ terminal-first  ·  ✓ reproducible fixture</text>
  </g>
</svg>
